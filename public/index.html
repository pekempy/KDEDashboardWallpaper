<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLaDOS Dashboard</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

  <!-- Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="index.css">
</head>
<body>
  <!-- Dynamic Background -->
  <div id="bg-layer" class="bg-layer"></div>
  <div class="bg-overlay"></div>

  <div class="app-container">

    <!-- Top Navigation / Header -->
    <header class="glass-header">
      <div class="header-left">
        <div class="logo">
          <div class="portrait-frame">
            <img class="logo-portrait" id="logo-portrait" src="" alt="" title="">
            <span class="portrait-badge"></span>
          </div>
          <span class="logo-text">GLaDOS</span>
        </div>
        <div class="status-badge" id="server-status">
          <span class="dot pulse"></span> Online
        </div>
      </div>

      <div class="header-center">
        <div class="search-wrap">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="6.5"/><path d="M15 15 20.5 20.5"/><path d="M10 3.8 10.7 5.3 12.2 6 10.7 6.7 10 8.2 9.3 6.7 7.8 6 9.3 5.3Z" fill="currentColor" stroke="none"/></svg>
            <input type="text" id="global-search" placeholder="Search bookmarks, folders, containers…" autocomplete="off">
            <kbd class="search-kbd">/</kbd>
          </div>
          <div class="search-results" id="search-results"></div>
        </div>
      </div>

      <div class="header-right">
        <div class="clock-display" id="clock-display">00:00</div>
        <div class="date-display" id="date-display">Monday, January 1</div>
        <button class="icon-btn" id="btn-wallpaper" title="New Wallpaper">
          <svg class="header-btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="1.5"/>
            <circle cx="8.5" cy="9" r="1.5"/>
            <path d="M3 16 L8 11 L12 15 L16 10 L21 16"/>
          </svg>
        </button>
        <button class="icon-btn" id="btn-edit-mode" title="Toggle Edit Mode">
          <svg class="header-btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 L13 6 M12 21 L11 18 M3 12 L6 11 M21 12 L18 13 M5.5 5.5 L7.5 7.5 M18.5 18.5 L16.5 16.5 M5.5 18.5 L7.5 16.5 M18.5 5.5 L16.5 7.5"/>
            <circle cx="12" cy="12" r="4.5"/>
            <path d="M12 9.5 L12.8 11.2 L14.5 12 L12.8 12.8 L12 14.5 L11.2 12.8 L9.5 12 L11.2 11.2 Z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Widget columns - a compact HUD on each corner, not a full-screen
         dashboard, so most of the wallpaper stays visible -->
    <div class="columns-row">
    <main class="widget-column">

      <div class="glass-card widget widget-vitals">
        <div class="widget-header">
          <h3>
            <svg class="widget-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2 L20 12 L12 22 L4 12 Z"/>
              <path d="M12 2 L8 9 M12 2 L16 9 M4 12 L8 9 M20 12 L16 9 M8 9 L16 9"/>
              <path d="M1 12 H6 L9 6.5 L12 17.5 L15 8.5 L17 12 H23"/>
            </svg>
            System Vitals
          </h3>
          <span class="uptime" id="uptime-display">00:00:00 up</span>
        </div>
        <div class="vitals-grid">
          <div class="vital-item">
            <div class="vital-label">CPU</div>
            <div class="progress-track"><div class="progress-fill" id="cpu-bar"></div></div>
            <div class="vital-val" id="cpu-val">0%</div>
          </div>
          <div class="vital-item">
            <div class="vital-label">RAM</div>
            <div class="progress-track"><div class="progress-fill" id="ram-bar"></div></div>
            <div class="vital-val" id="ram-val">0%</div>
          </div>
        </div>
        <div class="disk-vitals" id="disk-vitals"></div>
        <div class="widget-actions">
          <button class="btn btn-sm btn-ghost" onclick="app.launchKonsole()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M7 9l3.5 3L7 15M13 15h4"/></svg> Terminal</button>
          <button class="btn btn-sm btn-ghost" onclick="app.launchUpdate()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 0 1 13-5.2M19.5 12a7.5 7.5 0 0 1-13 5.2"/><path d="M17.5 3.5v4h-4M6.5 20.5v-4h4"/></svg> Update</button>
        </div>
      </div>

      <div class="glass-card widget widget-links">
        <div class="widget-header">
          <h3>
            <svg class="widget-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 3 H18 V21 L12 15.5 L6 21 Z"/>
              <path d="M12 6.5 L13.2 8.8 L15.5 10 L13.2 11.2 L12 13.5 L10.8 11.2 L8.5 10 L10.8 8.8 Z"/>
            </svg>
            Bookmarks
          </h3>
          <button class="icon-btn-sm edit-only" onclick="app.addBookmark()"><i data-lucide="plus"></i></button>
        </div>
        <div class="links-grid" id="bookmarks-grid"></div>
      </div>

      <div class="glass-card widget widget-links">
        <div class="widget-header">
          <h3>
            <svg class="widget-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6.5a1.5 1.5 0 0 1 1.5-1.5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5Z"/>
              <path d="M12 10.5 L13 12.5 L15 13 L13 13.5 L12 15.5 L11 13.5 L9 13 L11 12.5 Z"/>
            </svg>
            Folders
          </h3>
          <button class="icon-btn-sm edit-only" onclick="app.addFolder()"><i data-lucide="plus"></i></button>
        </div>
        <div class="links-grid" id="folders-grid"></div>
      </div>
    </main>

    <aside class="widget-column widget-column-right">

      <div class="glass-card widget" id="widget-downloads">
        <div class="widget-header">
          <h3>
            <svg class="widget-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2.5v10.5M8 9.5 12 13.5 16 9.5"/>
              <path d="M4 17.5h16M4 21h10"/>
            </svg>
            Downloads
          </h3>
        </div>
        <div class="downloads-list" id="downloads-list"></div>
      </div>

      <div class="glass-card widget" id="widget-health" style="display:none;">
        <div class="widget-header">
          <h3>
            <svg class="widget-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2.5 20 6v6c0 5-3.5 8.5-8 9.5-4.5-1-8-4.5-8-9.5V6Z"/>
              <path d="M9 12h2l1-2.5 1.5 5 1.5-2.5h2"/>
            </svg>
            Container Health
          </h3>
        </div>
        <div class="health-list" id="health-list"></div>
      </div>

      <div class="glass-card widget" id="widget-recent">
        <div class="widget-header">
          <h3>
            <svg class="widget-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="6" y="6" width="14" height="14" rx="1.5"/>
              <path d="M4 4h11a1.5 1.5 0 0 1 1.5 1.5"/>
              <circle cx="10.5" cy="11" r="1.5"/>
              <path d="M6 16.5 10 12.5 13 15.5 16.5 12 20 15.5"/>
            </svg>
            Recently Added
          </h3>
        </div>
        <div class="recent-grid" id="recent-grid"></div>
      </div>
    </aside>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="edit-modal">
      <div class="glass-card modal">
        <div class="modal-header">
          <h3 id="modal-title">Edit Item</h3>
          <button class="icon-btn-sm" onclick="app.closeModal()"><i data-lucide="x"></i></button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="edit-name" class="input-modern">
          </div>
          <div class="form-group">
            <label>Path / URL</label>
            <input type="text" id="edit-path" class="input-modern">
          </div>
          <div class="form-group">
            <label>Icon (Lucide name or URL)</label>
            <input type="text" id="edit-icon" class="input-modern">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" onclick="app.closeModal()">Cancel</button>
          <button class="btn btn-primary" id="btn-save-edit">Save Changes</button>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">Message</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
